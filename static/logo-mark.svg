<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="512" height="512" rx="112" fill="url(#shieldGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="8" opacity="0.85" />

  <!-- Protective Heraldic Shield Outline -->
  <path d="M 256 72 
           C 340 72, 408 104, 416 184
           C 416 304, 336 384, 256 440
           C 176 384, 96 304, 96 184
           C 104 104, 172 72, 256 72 Z"
        fill="#0b1329" 
        stroke="url(#borderGrad)" 
        stroke-width="14" 
        stroke-linejoin="round" />

  <!-- Radiant Sun (Weather & Heat Monitoring) -->
  <circle cx="256" cy="200" r="54" fill="url(#sunGrad)" filter="url(#glow)" />
  
  <!-- Geometric Sun Rays -->
  <g stroke="#fbbf24" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="124" x2="256" y2="106" />
    <line x1="256" y1="276" x2="256" y2="294" />
    <line x1="180" y1="200" x2="162" y2="200" />
    <line x1="332" y1="200" x2="350" y2="200" />
    <line x1="202" y1="146" x2="190" y2="134" />
    <line x1="310" y1="254" x2="322" y2="266" />
    <line x1="202" y1="254" x2="190" y2="266" />
    <line x1="310" y1="146" x2="322" y2="134" />
  </g>

  <!-- Ocean Waves & River Intelligence (Odisha Coastline & Mahanadi) -->
  <path d="M 140 270 
           Q 190 230, 240 260 
           T 340 255 
           T 376 270
           C 365 330, 318 380, 256 418
           C 194 380, 148 330, 140 270 Z"
        fill="url(#waveGrad1)" 
        opacity="0.35" />

  <path d="M 130 300 
           Q 190 260, 256 295 
           T 382 295 
           L 370 330
           C 330 382, 290 410, 256 426
           C 222 410, 182 382, 142 330 Z"
        fill="url(#waveGrad1)" 
        opacity="0.75" />

  <!-- Front Crest Emerald Safety Arc -->
  <path d="M 154 330 
           Q 206 300, 256 322 
           T 358 322 
           C 330 375, 296 405, 256 422
           C 216 405, 182 375, 154 330 Z"
        fill="url(#waveGrad2)" />

  <!-- Workability Safety Radar Pulse / Checkmark Core -->
  <path d="M 226 288 L 248 310 L 296 262" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>