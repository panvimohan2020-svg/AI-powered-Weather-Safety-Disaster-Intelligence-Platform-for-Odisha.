<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="solarAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="coastalCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="safetyEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="116" fill="url(#shieldBg)" />
  <rect width="502" height="502" x="5" y="5" rx="112" fill="none" stroke="url(#cyberBorder)" stroke-width="7" opacity="0.9" />

  <!-- Outer Faceted Heraldic Shield -->
  <path d="M 256 64 
           L 418 108 
           C 424 230, 376 348, 256 448 
           C 136 348, 88 230, 94 108 
           Z"
        fill="#0b1329" 
        stroke="url(#cyberBorder)" 
        stroke-width="12" 
        stroke-linejoin="round" />

  <!-- Inner Inset Protective Shield -->
  <path d="M 256 94 
           L 392 130 
           C 396 226, 356 322, 256 410 
           C 156 322, 116 226, 120 130 
           Z"
        fill="#070c1a" 
        stroke="#1e293b" 
        stroke-width="4" />

  <!-- Solar Heat Intelligence (Upper Geometric Crest) -->
  <circle cx="256" cy="190" r="48" fill="url(#solarAmber)" filter="url(#softGlow)" />
  
  <!-- Faceted Radial Solar Vectors -->
  <g stroke="#fbbf24" stroke-width="5" stroke-linecap="round" opacity="0.95">
    <line x1="256" y1="126" x2="256" y2="108" />
    <line x1="256" y1="254" x2="256" y2="272" />
    <line x1="192" y1="190" x2="174" y2="190" />
    <line x1="320" y1="190" x2="338" y2="190" />
    <line x1="210" y1="144" x2="198" y2="132" />
    <line x1="302" y1="236" x2="314" y2="248" />
    <line x1="210" y1="236" x2="198" y2="248" />
    <line x1="302" y1="144" x2="314" y2="132" />
  </g>

  <!-- Primary Coastal / River Wave Dynamic (Bay of Bengal & Mahanadi) -->
  <path d="M 140 285 
           Q 198 245, 256 278 
           T 372 272 
           C 356 335, 312 378, 256 405 
           C 200 378, 156 335, 140 285 Z"
        fill="url(#coastalCyan)" 
        opacity="0.85" />

  <!-- Secondary Green Workability Safety Wave -->
  <path d="M 160 312 
           Q 208 285, 256 305 
           T 352 305 
           C 332 350, 298 382, 256 402 
           C 214 382, 180 350, 160 312 Z"
        fill="url(#safetyEmerald)" />

  <!-- Real-Time AI Weather Signal / Workability Safety Vector -->
  <path d="M 198 268 
           L 236 268 
           L 252 235 
           L 268 295 
           L 282 255 
           L 294 268 
           L 316 268" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#softGlow)" />
</svg>